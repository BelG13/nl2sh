name: CI / Tests

# Triggers the workflow on push and pull request events
on:
  push:
    branches:
      - main
  pull_request:
    # Runs the workflow whenever a PR is opened, synchronized, or ready for review
    branches:
      - main
    types: [ opened, synchronize, reopened ]


jobs:
  test:
    runs-on: ubuntu-latest
    
    # Use a matrix to test across different Python versions
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: ⬇️ Checkout Repository
        # Action to pull the code from the repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Keep this line, but make sure the dependency file is listed for caching
          cache: 'pip' 
          cache-dependency-path: pyproject.toml 
          
      # 🚀 Caching large dependencies
      - name: 💾 Cache PyTorch and large packages
        uses: actions/cache@v4
        with:
          # This caches the contents of the entire virtual environment's site-packages
          path: ${{ env.pythonLocation }}/lib/python*/site-packages
          key: ${{ runner.os }}-${{ matrix.python-version }}-site-packages-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-site-packages-
            ${{ runner.os }}-

      - name: 📦 Install Package and Dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: 🧪 Run Pytest
        run: |
          pytest -v
